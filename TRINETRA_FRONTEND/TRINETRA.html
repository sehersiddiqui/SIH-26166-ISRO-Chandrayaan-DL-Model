<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRINETRA &mdash; Multimodal Lunar Correspondence System</title>
<style>
:root{
  --bg:#070b16; --bg2:#0b1120; --panel:#0e1526; --panel2:#111a30;
  --line:#1c2740; --line2:#243252;
  --text:#e7ecf7; --dim:#8a97b8; --dim2:#5c6890;
  --ohrc:#f2994a; --ohrc-dim:#5a3d20;
  --tmc:#4fc3e8; --tmc-dim:#1f4a5c;
  --iirs:#9b7ee8; --iirs-dim:#3d3160;
  --good:#4ade80; --warn:#f2994a; --bad:#f26060;
  --accent:#4fc3e8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;}
.mono{font-family:"SF Mono",SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;}
a{color:inherit;}
button{font-family:inherit;}

/* ---------- shell ---------- */
.shell{display:flex; min-height:100vh;}
.rail{width:230px; flex-shrink:0; background:var(--bg2); border-right:1px solid var(--line);
  padding:22px 16px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
.brand{display:flex; align-items:baseline; gap:6px; margin-bottom:2px;}
.brand .word{font-size:20px; font-weight:700; letter-spacing:4px;}
.brand .tri{color:var(--tmc); font-size:16px;}
.brand-sub{font-size:9.5px; letter-spacing:2px; color:var(--dim2); margin:4px 0 26px;}

.stepnav{display:flex; flex-direction:column; gap:3px;}
.stepnav button{
  all:unset; cursor:pointer; display:flex; align-items:center; gap:10px;
  padding:10px 10px; border-radius:8px; color:var(--dim); font-size:13px; line-height:1.3;
}
.stepnav button .n{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:10px; font-family:"SF Mono",monospace; border:1px solid var(--line2); color:var(--dim2);
}
.stepnav button.active{background:var(--panel2); color:var(--text);}
.stepnav button.active .n{background:var(--tmc); color:#04202a; border-color:var(--tmc);}
.stepnav button.done .n{background:transparent; border-color:var(--good); color:var(--good);}
.stepnav button:hover:not(.active){background:#0e152a;}

.rail-foot{margin-top:auto; padding-top:16px; border-top:1px solid var(--line); font-size:11px; color:var(--dim2); line-height:1.6;}
.rail-foot .dot{width:6px;height:6px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px;}

.main{flex:1; min-width:0; padding:26px 34px 60px;}
.topbar{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; gap:20px; flex-wrap:wrap;}
.topbar h1{font-size:22px; margin:0 0 4px; font-weight:600;}
.topbar .sub{color:var(--dim); font-size:13px; max-width:640px;}
.pill{font-size:10.5px; padding:4px 10px; border-radius:20px; border:1px solid var(--line2); color:var(--dim); white-space:nowrap;}
.pill.on{border-color:var(--good); color:var(--good);}
.pill.info{border-color:var(--tmc); color:var(--tmc);}

.grid{display:grid; gap:16px;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:1fr 1fr 1fr;}
.g4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1000px){.g2,.g3,.g4{grid-template-columns:1fr;}}

.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px;}
.card h3{margin:0 0 4px; font-size:13px; font-weight:600; color:var(--text);}
.card .hint{font-size:11.5px; color:var(--dim2); margin-bottom:14px;}
.stat{font-size:26px; font-weight:700; font-family:"SF Mono",monospace;}
.stat.small{font-size:19px;}
.statlabel{font-size:11px; color:var(--dim); margin-top:2px;}

.badge-ohrc{color:var(--ohrc);} .badge-tmc{color:var(--tmc);} .badge-iirs{color:var(--iirs);}
.dot-ohrc{background:var(--ohrc);} .dot-tmc{background:var(--tmc);} .dot-iirs{background:var(--iirs);}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:3px 9px; border-radius:6px; background:#0c1327; border:1px solid var(--line2);}
.chip .sw{width:7px;height:7px;border-radius:50%;}

table.dt{width:100%; border-collapse:collapse; font-size:12.5px;}
table.dt th{text-align:left; color:var(--dim2); font-weight:500; font-size:10.5px; letter-spacing:.03em; padding:6px 10px; border-bottom:1px solid var(--line);}
table.dt td{padding:7px 10px; border-bottom:1px solid #121a2e; font-family:"SF Mono",monospace; font-size:12px;}
table.dt tr:last-child td{border-bottom:none;}

.btn{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:8px; padding:10px 18px;
  border-radius:8px; font-size:13px; font-weight:600;}
.btn.primary{background:linear-gradient(135deg,#5fd3f5,#3aa0d8); color:#03222e;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.ghost{border:1px solid var(--line2); color:var(--text);}
.btn.ghost:hover{background:#0e152a;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.footer-nav{display:flex; justify-content:space-between; margin-top:26px; padding-top:18px; border-top:1px solid var(--line);}

.imgwrap{position:relative; border-radius:8px; overflow:hidden; border:1px solid var(--line2); background:#000;}
.imgwrap img, .imgwrap canvas{display:block; width:100%; height:auto; image-rendering:pixelated;}
.imgwrap canvas{position:absolute; top:0; left:0;}
.caption{font-size:10.5px; color:var(--dim2); margin-top:6px; text-align:center;}

.tabbar{display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--line); padding-bottom:0;}
.tabbar button{all:unset; cursor:pointer; font-size:12.5px; padding:9px 14px; color:var(--dim); border-bottom:2px solid transparent;}
.tabbar button.active{color:var(--text); border-color:var(--tmc);}

.note{font-size:11.5px; color:var(--dim2); background:#0c1327; border:1px solid var(--line2); border-radius:8px; padding:10px 12px; line-height:1.5;}
.note b{color:var(--dim);}

.progress-track{height:6px; background:#0c1327; border-radius:4px; overflow:hidden; margin-top:8px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--tmc),var(--iirs)); border-radius:4px; transition:width .5s ease;}

.kv{display:flex; justify-content:space-between; font-size:12px; padding:5px 0; border-bottom:1px dashed #131c33;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--dim);}
.kv .v{font-family:"SF Mono",monospace;}

.legend-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px;}

.slidebox{display:flex; align-items:center; gap:10px; margin-top:10px;}
.slidebox input[type=range]{flex:1; accent-color:var(--tmc);}

.zoomstage{position:relative; border-radius:8px; overflow:hidden; border:1px solid var(--line2); background:#000; aspect-ratio:1/1;}
.zoomstage img{position:absolute; image-rendering:pixelated;}
.crosshair{position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px; pointer-events:none;}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:var(--good);}
.crosshair::before{left:7px;top:0;width:2px;height:16px;}
.crosshair::after{left:0;top:7px;width:16px;height:2px;}
.crosshair.orig::before,.crosshair.orig::after{background:var(--bad);}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line2); border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ================= LANDING PAGE ================= */
.rail{display:flex; flex-direction:column;}
.lrail-brand{display:flex; align-items:center; gap:9px; margin-bottom:26px;}
.lrail-logo{width:34px;height:34px; flex-shrink:0;}
.lrail-brand-text{font-size:10.5px; font-weight:700; letter-spacing:1.5px; line-height:1.35;}
.lrail-brand-text .hi{color:var(--ohrc);}
.lrail-brand-text .en{color:var(--dim);}

.lnav{display:flex; flex-direction:column; gap:2px;}
.lnav button{all:unset; cursor:pointer; display:flex; align-items:center; gap:11px;
  padding:10px 12px; border-radius:9px; color:var(--dim); font-size:13.5px;
  border-left:2px solid transparent;}
.lnav button svg{width:17px;height:17px; flex-shrink:0; opacity:.85;}
.lnav button.active{background:linear-gradient(90deg,#12335a55,transparent); color:#fff; border-left:2px solid var(--tmc);}
.lnav button.active svg{opacity:1; color:var(--tmc);}
.lnav button:hover:not(.active){background:#0e152a; color:var(--text);}

.lrail-spacer{flex:1;}
.lrail-settings{margin-top:6px; padding-top:10px; border-top:1px solid var(--line);}
.lrail-quote{font-size:11px; font-style:italic; color:var(--dim2); line-height:1.5; padding:0 6px; margin-top:22px;}
.lrail-earth{position:relative; height:60px; margin-top:16px; overflow:hidden; border-radius:0 0 0 0;}
.lrail-earth::before{content:""; position:absolute; width:170px; height:170px; border-radius:50%;
  left:-70px; bottom:-130px;
  background:radial-gradient(circle at 32% 28%, #3aa6e0, #1a4a8a 45%, #0a1f3d 72%, transparent 74%);
  box-shadow:0 0 40px 6px #1a4a8a55;}

.lp-topbar{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; flex-wrap:wrap; gap:14px;}
.lp-brandblock .word2{font-size:26px; font-weight:800; letter-spacing:7px;}
.lp-brandblock .tri2{color:var(--tmc); margin-left:4px;}
.lp-brandblock .sub1{font-size:10.5px; letter-spacing:3px; color:var(--dim); margin-top:5px;}
.lp-brandblock .sub2{font-size:10px; letter-spacing:2.5px; color:var(--dim2); margin-top:10px;}
.lp-statusblock{display:flex; align-items:center; gap:16px; font-size:10.5px; letter-spacing:1.2px; color:var(--dim); margin-top:4px;}
.lp-statusblock .div{width:1px; height:26px; background:var(--line2);}
.lp-statusblock .l1{color:var(--good); display:flex; align-items:center; gap:6px; margin-top:3px;}
.lp-statusblock .l1 .dt{width:6px;height:6px;border-radius:50%;background:var(--good); box-shadow:0 0 8px 1px #4ade8088;}
.lp-statusblock strong{color:var(--text); display:block; font-weight:600; letter-spacing:1.4px;}

.lp-hero{display:grid; grid-template-columns:1.05fr 1fr; gap:20px; margin-top:34px; align-items:center;}
@media(max-width:1100px){.lp-hero{grid-template-columns:1fr;}}
.lp-eyebrow{display:flex; align-items:center; gap:10px; font-size:11px; letter-spacing:2.5px; color:var(--tmc); margin-bottom:18px;}
.lp-eyebrow .ln{width:26px; height:1px; background:var(--tmc);}
.lp-h1{font-size:46px; font-weight:700; line-height:1.08; margin:0;}
.lp-h1 .grad{background:linear-gradient(90deg,#5fd3f5,#9b7ee8); -webkit-background-clip:text; background-clip:text; color:transparent;}
.lp-desc{font-size:14.5px; color:var(--dim); line-height:1.65; max-width:480px; margin:20px 0 26px;}
.lp-ctarow{display:flex; gap:12px; flex-wrap:wrap;}
.btn.lbig{padding:13px 24px; font-size:13.5px; border-radius:9px;}
.btn.lbig.primary{box-shadow:0 8px 24px -6px #4fc3e888;}

.lp-features{display:flex; gap:30px; margin-top:34px; flex-wrap:wrap;}
.lp-feat{display:flex; align-items:center; gap:10px;}
.lp-feat .ic{width:30px;height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  background:#0e1526; border:1px solid var(--line2);}
.lp-feat .ic svg{width:15px;height:15px;}
.lp-feat .tt{font-size:12.5px; font-weight:600; color:var(--text);}
.lp-feat .ss{font-size:10.5px; color:var(--dim2);}

.moonwrap{position:relative; width:100%; max-width:560px; aspect-ratio:1/1; margin:0 auto;}
.moonwrap .orbits{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
.moon-sphere{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:52%; height:52%; border-radius:50%; overflow:hidden;
  box-shadow:0 0 60px 10px #4fc3e81c, inset -18px -14px 50px 0 #000000cc, inset 10px 8px 30px 0 #ffffff22;
  background:#1a2030;}
.moon-sphere img{position:absolute; width:180%; height:180%; left:-45%; top:-38%; object-fit:cover; filter:contrast(1.08) brightness(1.02);}
.moon-sphere .shade{position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, transparent 0%, transparent 30%, rgba(10,14,24,0.55) 68%, rgba(5,7,14,0.92) 100%);}
.moon-sphere .term{position:absolute; inset:0; border-radius:50%;
  background:linear-gradient(115deg, rgba(255,255,255,0.10) 0%, transparent 34%, transparent 60%, rgba(0,0,0,0.6) 88%);}
.moon-vlabel{position:absolute; right:-4px; top:44%; font-size:9px; letter-spacing:2.5px; color:var(--dim2); line-height:1.8; text-align:right;}

.lp-cards{display:grid; grid-template-columns:1.05fr 1.05fr 1.05fr 1.6fr; gap:16px; margin-top:40px;}
@media(max-width:1150px){.lp-cards{grid-template-columns:1fr 1fr;}}
.sensor-card{border-radius:12px; padding:16px; border:1px solid var(--line); background:var(--panel); position:relative; overflow:hidden;}
.sensor-card.ohrc{border-color:#f2994a55;}
.sensor-card.tmc{border-color:#4fc3e855;}
.sensor-card.iirs{border-color:#9b7ee855;}
.sensor-card .thumb{width:100%; aspect-ratio:1/1; border-radius:8px; overflow:hidden; margin-bottom:12px; background:#050810; position:relative;}
.sensor-card .thumb img{width:100%;height:100%;object-fit:cover; display:block;}
.sensor-card .thumb .ring{position:absolute; inset:0; border-radius:8px;}
.sensor-card.ohrc .thumb .ring{box-shadow:inset 0 0 0 1.5px #f2994a77;}
.sensor-card.tmc .thumb .ring{box-shadow:inset 0 0 0 1.5px #4fc3e877;}
.sensor-card.iirs .thumb .ring{box-shadow:inset 0 0 0 1.5px #9b7ee877;}
.sensor-card .name{font-size:16px; font-weight:700;}
.sensor-card .desc{font-size:11px; color:var(--dim2); margin-top:1px;}
.sensor-card .bottomrow{display:flex; align-items:flex-end; justify-content:space-between; margin-top:14px;}
.sensor-card .bignum{font-size:26px; font-weight:800; font-family:"SF Mono",monospace;}
.sensor-card .bignumlabel{font-size:10px; letter-spacing:1.5px; color:var(--dim2); margin-top:-2px;}
.sensor-card .gobtn{width:32px;height:32px; border-radius:50%; border:1px solid var(--line2); display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;}
.sensor-card .gobtn svg{width:14px;height:14px;}
.sensor-card.ohrc .gobtn{color:var(--ohrc); border-color:#f2994a55;}
.sensor-card.tmc .gobtn{color:var(--tmc); border-color:#4fc3e855;}
.sensor-card.iirs .gobtn{color:var(--iirs); border-color:#9b7ee855;}

.shared-card{border-radius:12px; padding:16px; border:1px solid var(--line2); background:linear-gradient(160deg,#101a30,#0b1120); display:flex; flex-direction:column;}
.shared-card .hdr{font-size:10.5px; letter-spacing:1.8px; color:var(--dim); margin-bottom:2px;}
.shared-card .legend{display:flex; flex-direction:column; gap:6px; position:absolute; right:18px; top:44px; font-size:10.5px;}
.shared-card canvas{width:100%; flex:1; min-height:120px;}
.shared-card .footlabel{text-align:center; font-size:10px; letter-spacing:2px; color:var(--dim2); margin-top:6px;}
.shared-card-inner{position:relative; flex:1; display:flex; flex-direction:column;}

.pipeline-card{margin-top:18px; border-radius:12px; border:1px solid var(--line); background:var(--panel); padding:18px 20px;}
.pipeline-card .hdr{font-size:11px; letter-spacing:1.8px; color:var(--dim); margin-bottom:14px; font-weight:600;}
.pipeline-row{display:flex; align-items:center; gap:0; overflow-x:auto; justify-content:space-between;}
.pstep{display:flex; align-items:center; gap:7px; background:#0c1327; border:1px solid var(--line2); border-radius:8px;
  padding:7px 10px; min-width:0; flex-shrink:1;}
.pstep .pnum{font-size:8.5px; color:var(--dim2); letter-spacing:1px;}
.pstep .plabel{font-size:10.5px; font-weight:600; line-height:1.2; margin-top:1px; white-space:nowrap;}
.pstep .pic{width:21px;height:21px; border-radius:6px; background:#141d33; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.pstep .pic svg{width:11px;height:11px; color:var(--tmc);}
.pchev{color:var(--dim2); flex-shrink:0; margin:0 5px; font-size:12px;}
.ptrail{margin-left:14px; font-size:9px; letter-spacing:1.2px; color:var(--dim2); text-align:right; line-height:1.6; flex-shrink:0; white-space:nowrap;}

.lp-footer{display:flex; justify-content:space-between; margin-top:26px; padding-top:18px; border-top:1px solid var(--line);
  font-size:10.5px; letter-spacing:1px; color:var(--dim2);}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail"></nav>
  <main class="main" id="main"></main>

// ---------------- simple canvas line chart (no external deps) ----------------
function drawLineChart(canvasId, seriesList, opts={}){
  const c = document.getElementById(canvasId);
  if(!c) return;
  const dpr = window.devicePixelRatio||1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w*dpr; c.height = h*dpr;
  const ctx = c.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const padL=38,padR=14,padT=14,padB=26;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  let allY = [];
  seriesList.forEach(s=>allY = allY.concat(s.data));
  let yMin = opts.yMin ?? Math.min(...allY);
  let yMax = opts.yMax ?? Math.max(...allY);
  if(yMin===yMax){yMax=yMin+1;}
  const n = seriesList[0].data.length;
  const xForI = i => padL + (i/(n-1))*plotW;
  const yForV = v => padT + (1-(v-yMin)/(yMax-yMin))*plotH;

  // gridlines
  ctx.strokeStyle = '#141d33'; ctx.lineWidth=1;
  ctx.fillStyle = '#5c6890'; ctx.font='10px -apple-system,sans-serif';
  for(let g=0; g<=4; g++){
    const v = yMin + (yMax-yMin)*g/4;
    const y = yForV(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillText(v.toFixed(1), 4, y+3);
  }
  // x labels
  const xt = opts.xTicks || [0, Math.floor(n/2), n-1];
  xt.forEach(i=>{
    const x = xForI(i);
    ctx.fillText(opts.xLabel ? opts.xLabel(i) : i, x-8, h-8);
  });

  seriesList.forEach(s=>{
    ctx.strokeStyle = s.color; ctx.lineWidth = s.width||2;
    ctx.beginPath();
    s.data.forEach((v,i)=>{
      const x=xForI(i), y=yForV(v);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    if(s.fill){
      ctx.lineTo(xForI(n-1), padT+plotH);
      ctx.lineTo(xForI(0), padT+plotH);
      ctx.closePath();
      ctx.fillStyle = s.color+'22';
      ctx.fill();
    }
  });
}

function drawBarChart(canvasId, labels, seriesList, opts={}){
  const c = document.getElementById(canvasId);
  if(!c) return;
  const dpr = window.devicePixelRatio||1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w*dpr; c.height = h*dpr;
  const ctx = c.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const padL=34,padR=10,padT=14,padB=28;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const groups = labels.length;
  const seriesCount = seriesList.length;
  const groupW = plotW/groups;
  const barW = (groupW*0.62)/seriesCount;
  let maxV = opts.max ?? Math.max(...seriesList.flatMap(s=>s.data));
  maxV = maxV*1.15;
  ctx.strokeStyle='#141d33'; ctx.fillStyle='#5c6890'; ctx.font='10px -apple-system,sans-serif';
  for(let g=0; g<=3; g++){
    const v = maxV*g/3;
    const y = padT+plotH-(v/maxV)*plotH;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillText((v*100).toFixed(0)+'%', 2, y+3);
  }
  labels.forEach((lab,gi)=>{
    const gx = padL + gi*groupW + groupW*0.19;
    seriesList.forEach((s,si)=>{
      const v = s.data[gi];
      const bh = (v/maxV)*plotH;
      const x = gx + si*barW;
      const y = padT+plotH-bh;
      ctx.fillStyle = s.color;
      ctx.fillRect(x,y,barW*0.86,bh);
    });
    ctx.fillStyle='#8a97b8'; ctx.textAlign='center';
    ctx.fillText(lab, padL+gi*groupW+groupW/2, h-9);
    ctx.textAlign='left';
  });
}

// ---------------- correspondence overlay canvas ----------------
function drawMatches(canvasIdA, canvasIdB, matches, showInliersOnly){
  [canvasIdA, canvasIdB].forEach((id,side)=>{
    const c = document.getElementById(id);
    if(!c) return;
    const w = c.clientWidth, h = c.clientHeight;
    c.width=w; c.height=h;
    const ctx = c.getContext('2d');
    ctx.clearRect(0,0,w,h);
    matches.forEach(m=>{
      if(showInliersOnly && !m.inlier) return;
      const x = (side===0? m.x1 : m.x2)*w;
      const y = (side===0? m.y1 : m.y2)*h;
      ctx.beginPath();
      ctx.arc(x,y,3.4,0,7);
      ctx.fillStyle = m.inlier ? '#4ade80' : '#f26060';
      ctx.globalAlpha = m.inlier?0.9:0.55;
      ctx.fill();
    });
    ctx.globalAlpha=1;
  });
}

afterRenderHooks.landing = function(){
  const c = document.getElementById('embedScatter');
  if(!c) return;
  const w = c.clientWidth, h = c.clientHeight || 130;
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,w,h);
  let seed = 7;
  function rnd(){ seed = (seed*9301+49297)%233280; return seed/233280; }
  const clusters = [
    {cx:w*0.24, cy:h*0.55, color:'#f2994a', n:60},
    {cx:w*0.52, cy:h*0.45, color:'#4fc3e8', n:60},
    {cx:w*0.78, cy:h*0.55, color:'#9b7ee8', n:60},
  ];
  clusters.forEach(cl=>{
    for(let i=0;i<cl.n;i++){
      const ang = rnd()*Math.PI*2, rad = Math.pow(rnd(),0.6)*w*0.11;
      const x = cl.cx + Math.cos(ang)*rad;
      const y = cl.cy + Math.sin(ang)*rad*0.75;
      ctx.beginPath(); ctx.arc(x,y,1.6,0,7);
      ctx.fillStyle = cl.color; ctx.globalAlpha = 0.55+rnd()*0.35;
      ctx.fill();
    }
  });
  ctx.globalAlpha=1;
};

// ---- boot ----
renderAll();

</script>
</body>
